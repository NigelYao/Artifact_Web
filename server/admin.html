<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title data-en="Artifact · Match admin">Artifact · 对局管理</title><style>

@font-face {
  font-family: 'Artifact KaiTi';
  src: local('KaiTi'), local('楷体'), local('STKaiti'), local('Kaiti SC'), local('Kaiti TC');
  font-style: normal;

  unicode-range: U+2E80-303F, U+3100-312F, U+31A0-31BF, U+31C0-31EF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE10-FE1F, U+FE30-FE4F, U+FF00-FFEF, U+20000-323AF;

:root{color-scheme:dark;font:15px/1.6 'Artifact KaiTi',system-ui,sans-serif;background:#101719;color:#e7e6df}body{max-width:1440px;margin:auto;padding:32px}h1{font-size:26px;color:#dfc690;margin:0}p{color:#9eadad}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}.metric{background:#1b272b;padding:16px 24px;min-width:130px;border-top:2px solid #b7a171}.metric strong{display:block;font-size:28px;color:#edd5a4}button,select{font:inherit;background:#243438;color:inherit;border:1px solid #65746d;border-radius:4px;padding:8px 14px}button:disabled{opacity:.4}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1040px;text-align:left}th,td{padding:13px 12px;border-bottom:1px solid #324143;vertical-align:top}th{color:#bdc6c2;font-weight:500}small{display:block;color:#94a9a5}.yes{color:#86d9a6}.no{color:#a7a6a0}code{color:#efd3a0;font-size:16px}.error{color:#ffae9a}footer{display:flex;align-items:center;gap:20px;margin:24px 0}@media(max-width:600px){body{padding:16px}header{display:block}.metric{min-width:110px;padding:12px}}
</style><header><div><h1 data-en="Artifact · Match admin">Artifact · 对局管理</h1><p data-en="Read-only overview · refreshes every 10 s">只读运行概览 · 每 10 秒更新</p></div><div id="service"></div></header><div class="metrics" id="metrics"></div><p data-en="Online counts dedupe anonymous browser identities; recent visitors had a heartbeat within the last 75 s, room connections are live now. Recent-visit counts may lag after a browser closes; multiple tabs in one browser count as one visitor and show the latest reported page. Unfinished offline matches stay listed as in-progress so they can be resumed.">在线人数按匿名浏览器身份去重；近期访问表示最近 75 秒有心跳，房间连接为当前实时连接。关闭浏览器后近期访问数可能延迟下降；同一浏览器多个页面合并为一个访客，类别显示最近报告的页面。未结束但已离线的对局保留在进行中，方便恢复。</p><h2 data-en="Online visitors">在线访客</h2><div class="table-wrap"><table style="min-width:620px"><thead><tr><th data-en="Anonymous visitor">匿名访客</th><th data-en="Latest page">最近页面</th><th data-en="Last active">最近活跃</th><th data-en="Live rooms">实时房间</th></tr></thead><tbody id="visitors"></tbody></table></div><h2 data-en="Matches">对局记录</h2><div class="toolbar"><label><span data-en="Show">查看</span> <select id="status"><option value="all" data-en="All matches">全部对局</option><option value="lobby" data-en="Waiting / deck prep">等待 / 构筑准备</option><option value="battle" data-en="In-progress matches (incl. offline)">进行中的对局（含离线）</option><option value="finished" data-en="Finished matches">历史已结束对局</option></select></label><button id="refresh" data-en="Refresh now">立即刷新</button><span id="updated"></span></div><div id="error" class="error" role="status"></div><div class="table-wrap"><table><thead><tr><th data-en="Code / status">匹配码 / 状态</th><th data-en="Radiant">天辉</th><th data-en="Dire">夜魇</th><th data-en="Battle progress">战斗进度</th><th data-en="Result">结果</th><th data-en="Created / last action">创建 / 最后操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button id="prev" data-en="Previous page">上一页</button><span id="pages"></span><button id="next" data-en="Next page">下一页</button></footer><script src="/i18n.js"></script><script>
const T=ArtifactI18n.T;
let page=1,total=0,busy=false;const $=id=>document.getElementById(id);
const date=t=>t?new Date(t).toLocaleString(ArtifactI18n.lang()==='en'?'en-US':'zh-CN'):'—';
function text(parent,tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el;}
async function refresh(){if(busy)return;busy=true;const states={lobby:T('准备中','Preparing'),battle:T('进行中','In progress'),finished:T('已结束','Finished')},phases={action:T('行动','Action'),shop:T('购物','Shop'),deploy:T('部署','Deploy'),ended:T('结束','Ended')};try{const res=await fetch(location.pathname.replace(/\/$/,'')+'/data?status='+encodeURIComponent($('status').value)+'&page='+page,{cache:'no-store'});if(!res.ok)throw Error(T('无法读取管理数据（','Cannot read admin data (')+res.status+T('）',')'));const d=await res.json();total=d.total;$('metrics').replaceChildren();for(const [label,value] of [[T('在线玩家','Players online'),d.online.users],[T('房间在线玩家','Players in rooms'),d.online.roomUsers],[T('近期访问','Recent visitors'),d.online.recentVisitors],[T('等待准备','Waiting to ready'),d.counts.lobby],[T('进行中','In progress'),d.counts.battle],[T('历史已结束','Finished'),d.counts.finished]]){const box=text($('metrics'),'div','', 'metric');text(box,'span',label);text(box,'strong',value);}$('service').textContent=T('服务运行 ','Service up ')+Math.floor(d.uptimeSeconds/3600)+T(' 小时 ',' h ')+Math.floor(d.uptimeSeconds%3600/60)+T(' 分钟',' min');$('updated').textContent=T('更新于 ','Updated ')+date(d.now);$('visitors').replaceChildren();const labels={lobby:T('游戏大厅','Game lobby'),single:T('单人对战 / 构筑','Solo / decks'),campaign:T('暗月剧情','Darkmoon Shards'),'online-room':T('联机准备房间','Online room'),'online-battle':T('联机战斗','Online battle')};for(const v of d.online.visitors){const row=text($('visitors'),'tr','');text(row,'td',v.id);text(row,'td',labels[v.page]||v.page);text(row,'td',date(v.lastSeen));text(row,'td',v.connected?v.rooms.join(' · ')+' · '+T('在线','online'):'—');}if(!d.online.visitors.length){const row=text($('visitors'),'tr',''),cell=text(row,'td',T('暂无在线访客','No visitors online'));cell.colSpan=4;}$('rows').replaceChildren();for(const room of d.rooms){const tr=text($('rows'),'tr',''),id=text(tr,'td','');text(id,'code',room.code);text(id,'small',states[room.status]||room.status);room.players.forEach((p,i)=>{const cell=text(tr,'td','');text(cell,'div',p.occupied?p.name:T('等待加入','Waiting for player'));text(cell,'small',room.connected[i]?'● '+T('在线','online'):p.occupied?'○ '+T('离线','offline'):'—',room.connected[i]?'yes':'no');text(cell,'small',p.heroes.join(' · '));});text(tr,'td',room.round===null?'—':T('第 ','Round ')+room.round+T(' 回合 · ',' · ')+(room.lane===null?'—':[T('上路','Top'),T('中路','Middle'),T('下路','Bottom')][room.lane]||room.lane)+' · '+(phases[room.phase]||room.phase));text(tr,'td',room.winner===null?'—':room.winner===0?T('天辉获胜','Radiant won'):room.winner===1?T('夜魇获胜','Dire won'):T('平局','Draw'));const time=text(tr,'td','');text(time,'div',date(room.created));text(time,'small',date(room.updated));}if(!d.rooms.length){const row=text($('rows'),'tr','');const cell=text(row,'td',T('暂无对局','No matches'));cell.colSpan=6;}$('pages').textContent=T('第 ','Page ')+page+' / '+Math.max(1,Math.ceil(total/d.size))+T(' 页 · ',' · ')+total+T(' 场',' matches');$('prev').disabled=page<=1;$('next').disabled=page*d.size>=total;$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
$('status').onchange=()=>{page=1;refresh();};$('refresh').onclick=refresh;$('prev').onclick=()=>{page--;refresh();};$('next').onclick=()=>{page++;refresh();};refresh();setInterval(()=>{if(!document.hidden)refresh();},10000);ArtifactI18n.onChange(refresh);
</script></html>
