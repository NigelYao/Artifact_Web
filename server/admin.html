<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Artifact · 对局管理</title><style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#101719;color:#e7e6df}body{max-width:1440px;margin:auto;padding:32px}h1{font-size:26px;color:#dfc690;margin:0}p{color:#9eadad}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin:25px 0}.metric{background:#1b272b;padding:16px 24px;min-width:130px;border-top:2px solid #b7a171}.metric strong{display:block;font-size:28px;color:#edd5a4}button,select{font:inherit;background:#243438;color:inherit;border:1px solid #65746d;border-radius:4px;padding:8px 14px}button:disabled{opacity:.4}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1040px;text-align:left}th,td{padding:13px 12px;border-bottom:1px solid #324143;vertical-align:top}th{color:#bdc6c2;font-weight:500}small{display:block;color:#94a9a5}.yes{color:#86d9a6}.no{color:#a7a6a0}code{color:#efd3a0;font-size:16px}.error{color:#ffae9a}footer{display:flex;align-items:center;gap:20px;margin:24px 0}@media(max-width:600px){body{padding:16px}header{display:block}.metric{min-width:110px;padding:12px}}
</style><header><div><h1>Artifact · 对局管理</h1><p>只读运行概览 · 每 10 秒更新</p></div><div id="service"></div></header><div class="metrics" id="metrics"></div><p>在线人数按匿名浏览器身份去重；近期访问表示最近 75 秒有心跳，房间连接为当前实时连接。关闭浏览器后近期访问数可能延迟下降；同一浏览器多个页面合并为一个访客，类别显示最近报告的页面。未结束但已离线的对局保留在进行中，方便恢复。</p><h2>在线访客</h2><div class="table-wrap"><table style="min-width:620px"><thead><tr><th>匿名访客</th><th>最近页面</th><th>最近活跃</th><th>实时房间</th></tr></thead><tbody id="visitors"></tbody></table></div><h2>对局记录</h2><div class="toolbar"><label>查看 <select id="status"><option value="all">全部对局</option><option value="lobby">等待 / 构筑准备</option><option value="battle">进行中的对局（含离线）</option><option value="finished">历史已结束对局</option></select></label><button id="refresh">立即刷新</button><span id="updated"></span></div><div id="error" class="error" role="status"></div><div class="table-wrap"><table><thead><tr><th>匹配码 / 状态</th><th>天辉</th><th>夜魇</th><th>战斗进度</th><th>结果</th><th>创建 / 最后操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button id="prev">上一页</button><span id="pages"></span><button id="next">下一页</button></footer><script>
let page=1,total=0,busy=false;const $=id=>document.getElementById(id),states={lobby:'准备中',battle:'进行中',finished:'已结束'},phases={action:'行动',shop:'购物',deploy:'部署',ended:'结束'};
const date=t=>t?new Date(t).toLocaleString('zh-CN'):'—';
function text(parent,tag,value,cls){const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;parent.append(el);return el;}
async function refresh(){if(busy)return;busy=true;try{const res=await fetch(location.pathname.replace(/\/$/,'')+'/data?status='+encodeURIComponent($('status').value)+'&page='+page,{cache:'no-store'});if(!res.ok)throw Error('无法读取管理数据（'+res.status+'）');const d=await res.json();total=d.total;$('metrics').replaceChildren();for(const [label,value] of [['在线玩家',d.online.users],['房间在线玩家',d.online.roomUsers],['近期访问',d.online.recentVisitors],['等待准备',d.counts.lobby],['进行中',d.counts.battle],['历史已结束',d.counts.finished]]){const box=text($('metrics'),'div','', 'metric');text(box,'span',label);text(box,'strong',value);}$('service').textContent='服务运行 '+Math.floor(d.uptimeSeconds/3600)+' 小时 '+Math.floor(d.uptimeSeconds%3600/60)+' 分钟';$('updated').textContent='更新于 '+date(d.now);$('visitors').replaceChildren();const labels={lobby:'游戏大厅',single:'单人对战 / 构筑',campaign:'暗月剧情','online-room':'联机准备房间','online-battle':'联机战斗'};for(const v of d.online.visitors){const row=text($('visitors'),'tr','');text(row,'td',v.id);text(row,'td',labels[v.page]||v.page);text(row,'td',date(v.lastSeen));text(row,'td',v.connected?v.rooms.join(' · ')+' · 在线':'—');}if(!d.online.visitors.length){const row=text($('visitors'),'tr',''),cell=text(row,'td','暂无在线访客');cell.colSpan=4;}$('rows').replaceChildren();for(const room of d.rooms){const tr=text($('rows'),'tr',''),id=text(tr,'td','');text(id,'code',room.code);text(id,'small',states[room.status]||room.status);room.players.forEach((p,i)=>{const cell=text(tr,'td','');text(cell,'div',p.occupied?p.name:'等待加入');text(cell,'small',room.connected[i]?'● 在线':p.occupied?'○ 离线':'—',room.connected[i]?'yes':'no');text(cell,'small',p.heroes.join(' · '));});text(tr,'td',room.round===null?'—':'第 '+room.round+' 回合 · '+(room.lane===null?'—':['上路','中路','下路'][room.lane]||room.lane)+' · '+(phases[room.phase]||room.phase));text(tr,'td',room.winner===null?'—':room.winner===0?'天辉获胜':room.winner===1?'夜魇获胜':'平局');const time=text(tr,'td','');text(time,'div',date(room.created));text(time,'small',date(room.updated));}if(!d.rooms.length){const row=text($('rows'),'tr','');const cell=text(row,'td','暂无对局');cell.colSpan=6;}$('pages').textContent='第 '+page+' / '+Math.max(1,Math.ceil(total/d.size))+' 页 · '+total+' 场';$('prev').disabled=page<=1;$('next').disabled=page*d.size>=total;$('error').textContent='';}catch(e){$('error').textContent=e.message;}finally{busy=false;}}
$('status').onchange=()=>{page=1;refresh();};$('refresh').onclick=refresh;$('prev').onclick=()=>{page--;refresh();};$('next').onclick=()=>{page++;refresh();};refresh();setInterval(()=>{if(!document.hidden)refresh();},10000);
</script></html>
