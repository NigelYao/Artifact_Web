<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a1d"><title>联机对战 · Artifact</title><link rel="stylesheet" href="online.css?v=20260909-match1"></head><body><main class="online-shell"><header><a href="index.html">← 返回游戏</a><span>ARTIFACT · THREEFOLD</span><span id="connection">联机大厅</span></header><section class="intro"><p class="eyebrow">双人对局 / 无需登录</p><h1>以牌相会，三路交锋。</h1><p>分享匹配码，带上各自的构筑。离开后，使用同一浏览器即可继续对局。</p></section><p id="notice" role="status" aria-live="polite"></p><section id="matchmaking" class="matchmaking"><div><p class="eyebrow">公开匹配</p><h2 id="match-title">寻找一位对手</h2><p id="match-description">加入队列至少等待 10 秒，再按先来先到配对。没有对手时将继续等待，可随时取消。</p><p id="match-clock" aria-live="off"></p><p id="match-error" role="status"></p></div><div class="match-actions"><button id="match-join" class="primary">开始匹配</button><button id="match-cancel" hidden>取消匹配</button><button id="match-retry" hidden>重试连接</button></div></section><section id="entry" class="entry"><div><h2>创建一场对战</h2><p>生成专属匹配码，邀请另一位玩家。</p><button id="create" class="primary">创建房间</button></div><form id="join-form"><h2>加入好友的战场</h2><label for="room-code">匹配码</label><div class="join-row"><input id="room-code" maxlength="12" placeholder="输入匹配码" autocomplete="off" autocapitalize="characters" required><button class="primary">加入房间</button><button id="spectate" type="button">实时观战</button></div></form></section><section id="resume" hidden><h2>继续未完成的对局</h2><div id="resume-list"></div></section><section id="room" hidden><div class="room-heading"><div><p class="eyebrow">房间匹配码</p><strong id="code"></strong></div><button id="copy">复制匹配码</button><button id="leave">离开大厅</button></div><div id="seats" class="seats"></div></section><section id="deck-picker" hidden><div class="deck-header"><h2>选择你的构筑</h2><div><button id="import">导入构筑</button><button id="export">导出所选构筑</button><button id="share-deck">分享所选构筑</button><button id="import-code">导入分享码</button><input type="file" id="deck-file" accept="application/json,.json" hidden></div></div><p class="muted">构筑来自当前浏览器。更换访问地址时，可从原地址的构筑页面导出 JSON 后在此导入。</p><div id="decks" class="decks"></div><div class="ready-bar"><p id="ready-hint">双方准备后，自动进入战场。</p><button id="ready" class="primary">确认构筑并准备</button></div><div id="match-ready-bar" class="ready-bar" hidden><p id="match-ready-hint"></p><button id="match-ready" class="primary">确认构筑并准备</button></div></section><footer>对局自动保存至此服务器 · 清除浏览器数据会丢失匿名席位凭证</footer></main><script src="i18n.js"></script><script src="data.js"></script><script src="decks.js"></script><script src="engine.js"></script><script src="/vendor/colyseus.js"></script><script src="online-client.js?v=20260909-watchtouch1"></script><script src="deck-share.js?v=20260909-watchtouch1"></script><script src="matchmaking.js?v=20260909-match1"></script><script src="online.js?v=20260909-match1"></script><script src="presence.js?v=20260909-presence1"></script></body></html>
