<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a1d"><title data-en="Online · Artifact Threefold" data-ru="По сети · Artifact Threefold">联机对战 · Artifact</title><link rel="stylesheet" href="online.css?v=20260909-match1"></head><body><main class="online-shell"><header><a href="index.html" data-en="← Back to the game" data-ru="← Вернуться в игру">← 返回游戏</a><span>ARTIFACT · THREEFOLD</span><span id="connection" data-en="Online lobby" data-ru="Сетевое лобби">联机大厅</span></header><section class="intro"><p class="eyebrow" data-en="Two-player duels / no sign-in" data-ru="Дуэли на двоих / без регистрации">双人对局 / 无需登录</p><h1 data-en="Meet over cards; clash on three lanes." data-ru="Встречайтесь за картами и сражайтесь на трёх линиях.">以牌相会，三路交锋。</h1><p data-en="Share a match code and bring your own decks. Leave anytime — resume in the same browser." data-ru="Поделитесь кодом матча и выберите свои колоды. Можно выйти и продолжить в том же браузере.">分享匹配码，带上各自的构筑。离开后，使用同一浏览器即可继续对局。</p></section><p id="notice" role="status" aria-live="polite"></p><section id="matchmaking" class="matchmaking"><div><p class="eyebrow" data-en="Public matchmaking" data-ru="Открытый поиск противника">公开匹配</p><h2 id="match-title" data-en="Find an opponent" data-ru="Найти противника">寻找一位对手</h2><p id="match-description" data-en="Join the queue for at least 10 seconds, then pair first-come-first-served. Keeps waiting if no opponent — cancel anytime." data-ru="Поиск длится не менее 10 секунд, пары формируются по порядку очереди. Если противника нет, поиск продолжается. Можно отменить в любой момент.">加入队列至少等待 10 秒，再按先来先到配对。没有对手时将继续等待，可随时取消。</p><p id="match-clock" aria-live="off"></p><p id="match-error" role="status"></p></div><div class="match-actions"><button id="match-join" class="primary" data-en="Start matchmaking" data-ru="Начать поиск">开始匹配</button><button id="match-cancel" data-en="Cancel matchmaking" data-ru="Отменить поиск" hidden>取消匹配</button><button id="match-retry" data-en="Retry connection" data-ru="Повторить подключение" hidden>重试连接</button></div></section><section id="entry" class="entry"><div><h2 data-en="Create a match" data-ru="Создать матч">创建一场对战</h2><p data-en="Generate a private match code and invite another player." data-ru="Создайте приватный код матча и пригласите другого игрока.">生成专属匹配码，邀请另一位玩家。</p><button id="create" class="primary" data-en="Create room" data-ru="Создать комнату">创建房间</button></div><form id="join-form"><h2 data-en="Join a friend's battle" data-ru="Присоединиться к другу">加入好友的战场</h2><label for="room-code" data-en="Match code" data-ru="Код матча">匹配码</label><div class="join-row"><input id="room-code" maxlength="12" placeholder="输入匹配码" data-en-placeholder="Enter match code" data-ru-placeholder="Введите код матча" autocomplete="off" autocapitalize="characters" required><button class="primary" data-en="Join room" data-ru="Войти в комнату">加入房间</button><button id="spectate" type="button" data-en="Spectate live" data-ru="Наблюдать">实时观战</button></div></form></section><section id="resume" hidden><h2 data-en="Resume unfinished matches" data-ru="Продолжить незавершённые матчи">继续未完成的对局</h2><div id="resume-list"></div></section><section id="room" hidden><div class="room-heading"><div><p class="eyebrow" data-en="Room match code" data-ru="Код комнаты">房间匹配码</p><strong id="code"></strong></div><button id="copy" data-en="Copy match code" data-ru="Скопировать код матча">复制匹配码</button><button id="leave" data-en="Leave the lobby" data-ru="Покинуть лобби">离开大厅</button></div><div id="seats" class="seats"></div></section><section id="deck-picker" hidden><div class="deck-header"><h2 data-en="Choose your deck" data-ru="Выберите свою колоду">选择你的构筑</h2><div><button id="import" data-en="Import deck" data-ru="Импортировать колоду">导入构筑</button><button id="export" data-en="Export selected" data-ru="Экспортировать выбранную">导出所选构筑</button><button id="share-deck" data-en="Share selected" data-ru="Поделиться выбранной">分享所选构筑</button><button id="import-code" data-en="Import share code" data-ru="Импортировать код колоды">导入分享码</button><input type="file" id="deck-file" accept="application/json,.json" hidden></div></div><p class="muted" data-en="Decks come from this browser. When the address changes, export JSON from the decks page at the original address and import it here." data-ru="Колоды хранятся в этом браузере. При смене адреса экспортируйте JSON со страницы колод по прежнему адресу и импортируйте его здесь.">构筑来自当前浏览器。更换访问地址时，可从原地址的构筑页面导出 JSON 后在此导入。</p><div id="decks" class="decks"></div><div class="ready-bar"><p id="ready-hint" data-en="The battle starts once both players are ready." data-ru="Бой начнётся, когда будут готовы оба игрока.">双方准备后，自动进入战场。</p><button id="ready" class="primary" data-en="Lock deck &amp; ready up" data-ru="Зафиксировать колоду и приготовиться">确认构筑并准备</button></div><div id="match-ready-bar" class="ready-bar" hidden><p id="match-ready-hint"></p><button id="match-ready" class="primary" data-en="Lock deck &amp; ready up" data-ru="Зафиксировать колоду и приготовиться">确认构筑并准备</button></div></section><footer data-en="Matches autosave on this server · clearing browser data loses your anonymous seat credentials" data-ru="Матчи сохраняются на сервере · очистка данных браузера удалит ваши анонимные данные доступа к месту">对局自动保存至此服务器 · 清除浏览器数据会丢失匿名席位凭证</footer></main><script src="ru-ui.js?v=20260928-ru1"></script><script src="i18n.js?v=20260928-ru1"></script><script src="data.js"></script><script src="decks.js?v=20260928-ru1"></script><script src="engine.js?v=20260928-ru1"></script><script src="/vendor/colyseus.js"></script><script src="online-client.js?v=20260928-ru1"></script><script src="deck-share.js?v=20260928-ru1"></script><script src="matchmaking.js?v=20260928-ru1"></script><script src="online.js?v=20260928-ru1"></script><script src="presence.js?v=20260928-ru
