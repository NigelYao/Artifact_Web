<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>独立触摸手牌验证</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="battle-scene.css"><link rel="stylesheet" href="board-layout.css"><link rel="stylesheet" href="audio-gallery.css"><link rel="stylesheet" href="mobile-landscape.css"><link rel="stylesheet" href="responsive-battle.css"><link rel="stylesheet" href="touch-cards.css?v=20260909-touchdrag1">
<style>.fixture-tools{position:fixed;right:145px;top:0;z-index:99;display:flex;align-items:center;gap:4px;background:#111d;color:#fff;font:11px sans-serif}.fixture-tools button{font-size:11px;padding:5px;min-height:28px}.fixture-tools output{max-width:230px}.fixture-tools[hidden]{display:none}</style><link rel="stylesheet" href="pass-button.css?v=20260909-medallion1"><link rel="stylesheet" href="hero-skills.css"></head><body><div id="app"></div>
<script src="data.js"></script><script src="engine.js?v=20260912-mk1"></script><script src="effects.js?v=20260912-mk1"></script><script src="feedback.js"></script><script src="decks.js"></script><script src="action-audio.js"></script><script src="audio.js"></script>
<script>
if(location.port!=='8788')throw Error('Use dedicated test origin 8788; never run on production');
const fixture=new ArtifactEngine.Game(ARTIFACT_CARDS);fixture.newGame(ARTIFACT_DECKS[0],ARTIFACT_DECKS[1],1234);
for(const u of fixture.s.units){u.alive=false;u.lane=-1;u.readyRound=99;}fixture.s.lane=0;fixture.s.phase='action';fixture.s.turn=0;fixture.s.passes=0;fixture.s.events=[];
fixture.spawn('luna',0,0,1);fixture.spawn('meepo',0,0,2);const sniper=fixture.spawn('sniper',0,0,3);sniper.items.Weapon={k:'blink_dagger'};sniper.cooldowns={sniper:2};fixture.spawn('axe',1,0,2);
fixture.s.lanes[0].mana[0]=50;fixture.s.players[0].gold=100;
fixture.s.players[0].hand=['defensive_stance','frostbite','short_sword','healing_salve','gust','lightning_strike','defensive_stance','frostbite','short_sword','healing_salve','gust','lightning_strike','defensive_stance','frostbite'].map(k=>({uid:fixture.id(),k,lock:0}));
localStorage.setItem('artifact.match',JSON.stringify(fixture.s));localStorage.setItem('artifact.settings',JSON.stringify({muted:true,speed:1}));
</script>
<script src="scene.js"></script><script src="board.js"></script><script src="hero-skills.js"></script><script src="app.js?v=20260912-mk1"></script><script src="board-input.js"></script><script src="responsive-battle.js"></script><script src="touch-cards.js?v=20260909-touchdrag1"></script>
<div class="fixture-tools"><button id="touch-tap">开始触摸验证</button><button id="touch-hold">长按滑动验证</button><button id="touch-scroll">滚动验证</button><button id="touch-drag-cancel">拖出取消验证</button><button id="touch-drag-play">拖出施放验证</button><button id="fixture-hide">隐藏工具</button><output id="fixture-result" aria-live="polite">仅测试端口</output></div>
<script>
document.querySelector('[data-action="resume"]').click();
// Real DOM listeners handle every gesture. Only pointer capture is stubbed for
// these synthetic events because browsers do not register synthetic pointer IDs.
function fire(el,type,x,y){const original=el.setPointerCapture;el.setPointerCapture=()=>{};try{el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:71,pointerType:'touch',isPrimary:true,clientX:x,clientY:y,buttons:type==='pointerup'?0:1}));}finally{el.setPointerCapture=original;}}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
function baseline(){const strip=document.querySelector('.hand-scroll');strip.scrollLeft=0;const el=strip.querySelector('[data-hand]');const r=el.getBoundingClientRect();return {el,x:r.left+Math.min(20,r.width/2),y:Math.max(r.top+40,innerHeight-55),saved:JSON.stringify(ArtifactApp.game.s),strip};}
function report(ok,message){const output=document.getElementById('fixture-result');output.textContent=(ok?'PASS: ':'FAIL: ')+message;output.dataset.result=ok?'pass':'fail';}
document.getElementById('touch-tap').onclick=()=>{const t=baseline();fire(t.el,'pointerdown',t.x,t.y);fire(t.el,'pointerup',t.x,t.y);t.el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:2}));const preview=document.querySelector('.touch-card-preview');report(!!preview&&!!preview.querySelector('.touch-card-description').textContent&&!!preview.querySelector('.touch-card-art')?.getAttribute('src')&&t.saved===JSON.stringify(ArtifactApp.game.s),'描述可见，释放及兼容双击未出牌');};
document.getElementById('touch-hold').onclick=async()=>{const t=baseline();fire(t.el,'pointerdown',t.x,t.y);const before=document.querySelector('.touch-card-name')?.textContent;await pause(400);const next=t.strip.querySelectorAll('[data-hand]')[1].getBoundingClientRect();fire(t.el,'pointermove',next.left+Math.min(25,next.width/2),t.y);fire(t.el,'pointerup',next.left+Math.min(25,next.width/2),t.y);const after=document.querySelector('.touch-card-name')?.textContent;report(before!==after&&t.saved===JSON.stringify(ArtifactApp.game.s),'长按切换 '+before+' → '+after+'，未出牌');};
document.getElementById('touch-scroll').onclick=()=>{const t=baseline();fire(t.el,'pointerdown',t.x,t.y);fire(t.el,'pointermove',t.x-140,t.y);fire(t.el,'pointerup',t.x-140,t.y);report(t.strip.scrollLeft>0&&t.saved===JSON.stringify(ArtifactApp.game.s),'普通横滑滚动手牌，未出牌');};
document.getElementById('touch-drag-cancel').onclick=async()=>{const t=baseline();fire(t.el,'pointerdown',t.x,t.y);await pause(400);fire(t.el,'pointermove',t.x,t.y-55);const ghost=!!document.querySelector('.touch-drag-ghost');fire(document.documentElement,'pointermove',2,2);fire(document.documentElement,'pointerup',2,2);report(ghost&&!document.querySelector('.touch-drag-ghost')&&!ArtifactApp.ui.selection&&t.saved===JSON.stringify(ArtifactApp.game.s),'有跟手卡牌，非法区域释放取消且不耗牌');};
document.getElementById('touch-drag-play').onclick=async()=>{const t=baseline(),id=Number(t.el.dataset.hand);fire(t.el,'pointerdown',t.x,t.y);await pause(400);fire(t.el,'pointermove',t.x,t.y-55);const ghost=!!document.querySelector('.touch-drag-ghost'),target=document.querySelector('.ally-unit.targetable');if(!target){fire(document.documentElement,'pointercancel',0,0);report(false,'未找到友方合法目标');return;}const r=target.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;fire(document.documentElement,'pointermove',x,y);fire(document.documentElement,'pointerup',x,y);report(ghost&&!ArtifactApp.game.s.players[0].hand.some(h=>h.uid===id),'长按上拖，合法友方目标释放立即出牌');};
document.getElementById('fixture-hide').onclick=()=>document.querySelector('.fixture-tools').hidden=true;
</script></body></html>
