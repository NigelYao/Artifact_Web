<!doctype html><meta charset="utf-8"><title>精选音效解码验证</title><button id="check">验证全部音效</button><pre id="result">等待验证</pre><script>
document.querySelector('button').onclick=async()=>{const ctx=new AudioContext(),manifest=await fetch('../dist/assets/sfx/sources.json').then(r=>r.json()),actions=await fetch('../dist/assets/sfx/action-sources.json').then(r=>r.json()),files={...Object.fromEntries(Object.entries(manifest.files).map(([key,source])=>[key,key+source.slice(source.lastIndexOf('.'))])),...actions.samples},results=[];for(const [key,source] of Object.entries(files)){try{const response=await fetch('../dist/assets/sfx/'+source);if(!response.ok)throw Error(response.status);const buffer=await ctx.decodeAudioData(await response.arrayBuffer());results.push(key+' PASS '+buffer.duration.toFixed(2)+'s');}catch(e){results.push(key+' FAIL '+e.message);}}document.querySelector('pre').textContent=results.join('\n');await ctx.close();};</script>
