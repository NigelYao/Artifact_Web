<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>Dota 2 扩展交互验证</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="battle-scene.css"><link rel="stylesheet" href="board-layout.css"><link rel="stylesheet" href="mobile-landscape.css"><link rel="stylesheet" href="responsive-battle.css"><link rel="stylesheet" href="touch-cards.css"><link rel="stylesheet" href="hero-skills.css"></head><body><div id="app"></div>
<script src="data.js"></script><script src="engine.js"></script><script src="effects.js"></script><script src="hero-skills.js"></script><script src="feedback.js"></script><script src="decks.js"></script><script src="action-audio.js"></script><script src="audio.js"></script>
<script>
if(location.port!=='8788')throw Error('Use dedicated test origin 8788; never overwrite the main game save');
const fixture=new ArtifactEngine.Game(ARTIFACT_CARDS);fixture.newGame(ARTIFACT_DECKS.at(-1),ARTIFACT_DECKS[0],83);
fixture.s.units=[];fixture.s.events=[];fixture.s.lane=0;fixture.s.turn=0;fixture.s.phase='action';fixture.s.passes=0;
const pango=fixture.spawn('pangolier',0,0,0),willow=fixture.spawn('dark_willow',0,0,2);
const enemy=fixture.spawn('dark_willow',1,0,0);fixture.spawn('melee_creep',1,0,1);fixture.spawn('pangolier',1,0,2);fixture.spawn('melee_creep',1,0,3);
for(const u of fixture.all())u.cooldowns={};
for(let p=0;p<2;p++)fixture.s.players[p].heroes=fixture.all(p).filter(u=>u.hero).map(u=>u.k);
fixture.s.lanes[0].mana=[50,50];fixture.s.players[1].hand=[];
fixture.s.players[0].hand=['pangolier_lucky_shot','pangolier_gyroshell','dark_willow_bramble_maze','dark_willow_terrorize','defensive_stance','grazing_shot'].map(k=>({uid:fixture.id(),k,lock:0}));
const mode=new URLSearchParams(location.search).get('case');
if(mode==='states'){fixture.buff(enemy,{flipped:1},'round');fixture.buff(pango,{shield:4},'round');fixture.buff(willow,{shadowRealm:1,shadowBonus:3},'death');fixture.spawn('dark_willow_bramble',0,0,1);fixture.s.jex=[{uid:fixture.id(),owner:0,lane:0,pos:1,enhanced:true,createdBy:0}];}
if(mode==='monkey'){fixture.s.units=[];const mk=fixture.spawn('monkey_king',0,0,0);fixture.spawn('axe',0,0,3);mk.charges=2;fixture.spawn('monkey_soldier',0,0,1);fixture.spawn('dark_willow',1,0,1);fixture.spawn('melee_creep',1,0,0);fixture.spawn('melee_creep',1,0,2);for(let p=0;p<2;p++)fixture.s.players[p].heroes=fixture.all(p).filter(u=>u.hero).map(u=>u.k);fixture.s.players[0].hand=['monkey_king_command','monkey_king_command','grazing_shot'].map(k=>({uid:fixture.id(),k,lock:0}));for(const u of fixture.all())u.cooldowns={};}
fixture.s.events=[];localStorage.setItem('artifact.match',JSON.stringify(fixture.s));localStorage.setItem('artifact.settings',JSON.stringify({muted:true,speed:1}));
ArtifactEngine.Game.prototype.bestAction=()=>null;
</script>
<script src="scene.js"></script><script src="board.js"></script><script src="app.js"></script><script src="board-input.js"></script><script src="responsive-battle.js"></script><script src="touch-cards.js"></script>
<script>document.querySelector('[data-action="resume"]').click();ArtifactApp.focus(0);</script>
</body></html>
