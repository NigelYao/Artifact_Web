<!doctype html><meta charset="utf-8"><title>隔离的剧情测试入口</title><p>此测试仅能运行在 8788 测试端口，不会写入正式站点存档。</p><script src="../dist/data.js"></script><script src="../dist/engine.js"></script><script src="../dist/effects.js"></script><script src="../dist/campaign-data.js"></script><script src="../dist/campaign-deck.js"></script><script src="../dist/campaign-engine.js"></script><script>
(async()=>{if(location.port!=='8788')throw Error('Fixture must run on 8788 only');const fixtures=await(await fetch('campaign-fixtures.json')).json(),q=new URLSearchParams(location.search),p=fixtures[q.get('stage')||'2'];if(!p)throw Error('Unknown fixture');if(q.get('case')==='defeat'){const g=new ArtifactCampaign.CampaignGame(ARTIFACT_CARDS);g.s=p.battle;for(const u of g.all(0))g.damage(u,999,true);g.sweep();p.battle=g.s;}localStorage.setItem(ArtifactCampaign.SAVE_KEY,JSON.stringify(p));location.replace(p.battle?'../dist/campaign-battle.html':'../dist/campaign.html');})();
</script>
