<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../dist/"><title>技能与原声实机场景</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="battle-scene.css?v=20260909-support2"><link rel="stylesheet" href="board-layout.css?v=20260909-feel2"><link rel="stylesheet" href="audio-gallery.css?v=20260909-mobile2"><link rel="stylesheet" href="mobile-landscape.css?v=20260909-mobile2"></head><body><div id="app"></div><script src="data.js"></script><script src="engine.js"></script><script src="effects.js"></script><script src="feedback.js?v=20260912-mk1"></script><script src="decks.js"></script><script src="action-audio.js?v=20260912-mk1"></script><script src="audio.js?v=20260909-mobile2"></script><script src="scene.js?v=20260909-support2"></script><script>
if(location.port!=='8788')throw Error('Use isolated test server 8788');
const sample=ArtifactAudio.prototype.sample;ArtifactAudio.prototype.sample=function(name){const list=JSON.parse(document.body.dataset.samples||'[]');list.push(name);document.body.dataset.samples=JSON.stringify(list.slice(-20));return sample.call(this,name);};
const g=new ArtifactEngine.Game(ARTIFACT_CARDS);g.newGame(ARTIFACT_DECKS[0],ARTIFACT_DECKS[1],1234);for(const u of g.s.units){u.alive=false;u.lane=-1;u.readyRound=99;}g.s.events=[];g.s.lane=0;g.s.turn=0;
for(let p=0;p<2;p++){g.s.players[p].hand=[];g.s.lanes[0].mana[p]=50;g.spawn('axe',p,0,0);g.spawn('zeus',p,0,1);g.spawn('drow_ranger',p,0,2);}
g.s.players[0].hand=['frostbite','defensive_stance','gust','short_sword'].map(k=>({uid:g.id(),k,lock:0}));g.s.players[1].hand=[];
const mode=new URLSearchParams(location.search).get('case');if(mode==='lethal')g.all(1,0)[1].damage=6;if(mode==='enemy'){const lion=g.spawn('lion',1,0,3);lion.cooldown=0;lion.cooldowns={lion:0};g.s.turn=1;}
if(mode==='many')g.s.players[0].hand=Array.from({length:24},(_,i)=>({uid:g.id(),k:i===23?'short_sword':'defensive_stance',lock:0}));
if(mode==='draw')g.s.players[0].hand=[{uid:g.id(),k:'foresight',lock:0}];
if(mode==='summon')g.s.players[0].hand=[{uid:g.id(),k:'bronze_legionnaire',lock:0}];
if(mode==='shop'){g.s.phase='shop';g.openShop();}if(mode==='victory'||mode==='defeat'){const loser=mode==='victory'?1:0;for(const u of g.all(loser,0)){u.alive=false;u.lane=-1;u.readyRound=99;}g.s.lanes[0].towers[loser].hp=1;g.s.lanes[1].towers[loser].fallen=true;g.s.passes=1;}
const dealtCards=new Set();new MutationObserver(()=>{for(const card of document.querySelectorAll('[data-deal-at]'))dealtCards.add(card.dataset.hand);document.body.dataset.dealtCards=String(dealtCards.size);}).observe(document.body,{attributes:true,attributeFilter:['data-deal-at'],subtree:true});
const revealTimes=new WeakMap();new MutationObserver(records=>{for(const record of records){for(const el of record.addedNodes)if(el.nodeType===1&&el.matches('.skill-reveal'))revealTimes.set(el,performance.now());for(const el of record.removedNodes)if(revealTimes.has(el))document.body.dataset.revealDuration=String(Math.round(performance.now()-revealTimes.get(el)));}}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('animationstart',e=>{if(e.target.matches('.end-panel')&&e.elapsedTime===0)document.body.dataset.endEntrances=String(Number(document.body.dataset.endEntrances||0)+1);});
g.s.events=[];localStorage.setItem('artifact.match',JSON.stringify(g.s));localStorage.setItem('artifact.settings',JSON.stringify({muted:false,music:.28,effects:.6,speed:1}));
</script><script src="board.js?v=20260909-feel2"></script><script src="app.js?v=20260912-mk1"></script><script src="board-input.js?v=20260908-layout6"></script></body></html>
